[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wolf-ms-ppt-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents create and manipulate PowerPoint presentations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "amareca" },
]
keywords = ["mcp", "model-context-protocol", "powerpoint", "pptx", "ai", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Office Suites",
]

dependencies = [
    "mcp>=2,<3",
    "python-pptx>=1.0.0",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
wolf-ms-ppt-mcp = "wolf_ms_ppt_mcp.server:main"

[project.urls]
Homepage = "https://github.com/amareca/wolf-ms-ppt-mcp"
Repository = "https://github.com/amareca/wolf-ms-ppt-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/wolf_ms_ppt_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
